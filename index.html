<!doctype html>
<html lang="en">

    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            // 1. Ensure Window.prototype has a setter
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                var pDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
                if (pDesc && !pDesc.set) {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    configurable: true,
                    enumerable: true,
                    get: pDesc.get,
                    set: function(v) {
                      try {
                        Object.defineProperty(this, 'fetch', {
                          configurable: true,
                          writable: true,
                          enumerable: true,
                          value: v
                        });
                      } catch (_) {
                        this._f = v;
                      }
                    }
                  });
                }
              } catch (_) {}
            }

            // 2. Ensure window instance itself has a writable property
            var curFetch = window.fetch;
            if (curFetch) {
              try {
                Object.defineProperty(window, 'fetch', {
                  configurable: true,
                  writable: true,
                  enumerable: true,
                  value: curFetch
                });
              } catch (_) {
                try {
                  Object.defineProperty(window, 'fetch', {
                    configurable: true,
                    enumerable: true,
                    get: function() { return curFetch; },
                    set: function(fn) { curFetch = fn; }
                  });
                } catch (_) {}
              }
            }

            // 3. Prevent third-party browser extension crashes (e.g. Urban VPN requests.js) from failing the app
            window.addEventListener('error', function(e) {
              var isExt = e.filename && (e.filename.indexOf('chrome-extension://') !== -1 || e.filename.indexOf('moz-extension://') !== -1);
              var isFetchErr = e.message && e.message.indexOf('Cannot set property fetch') !== -1;
              if (isExt || isFetchErr) {
                e.preventDefault();
                e.stopImmediatePropagation();
              }
            }, true);
          }
        } catch (_) {}
      })();
    </script>
